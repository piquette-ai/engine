# .spf/spf.config.yaml — using the factory on itself.
#
# Wired for a Node/TypeScript repo: typecheck, a CLI-only build (the quality
# checks skip the visualizer SPA build; watch.setup bundles it once per
# worktree because ui_server tests need web/), and the test
# suite (which builds the CLI itself via `pretest`, so "build" and "test"
# together cover both dist/ and web/ correctness paths that matter day to
# day). `npm run build` (the full build, cli + app) is deliberately NOT a
# quality check — it installs app/'s deps and only matters right
# before a publish, which `.github/workflows/ci.yml`'s pack job already
# covers.
quality:
  checks:
    - { name: typecheck, operation: typecheck, argv: ["npm", "run", "typecheck"], timeout_seconds: 60 }
    - { name: build, operation: build, argv: ["npm", "run", "build:cli"], timeout_seconds: 120 }
    - { name: test, operation: build, argv: ["npm", "test"], timeout_seconds: 180 }
  suites:
    test: [test]
    all: [typecheck, build, test]

# Every agent runs on Claude Code instead of Flue — no separate provider API
# key needed beyond being logged into `claude` (spf doctor checks it's on
# PATH). Per-agent model/thinking/tools/writes overrides all still apply on
# top of this, same as with Flue.
defaults:
  coding_agent: claude_code
  model: sonnet

# The packaged defaults pin some agents to non-Claude models (planner →
# Fireworks Kimi, reviewer → OpenAI), and a per-agent `model:` beats
# `defaults.model`. Every agent here runs through the Claude Code CLI, which
# can't dispatch those ids — the #159 pilot's plan phase failed on exactly
# this. Pin them back to a Claude model (agents merge by name, so only the
# model changes).
agents:
  - { name: planner, model: sonnet }
  - { name: reviewer, model: sonnet }
  - { name: documenter, model: sonnet }

# `spf watch init` (seed the 5 spf:* labels) then `spf watch` — needs a
# GITHUB_TOKEN env var, classic PAT, "repo" scope (never "project" — see
# README.md's "GITHUB_TOKEN scope" section). Runs plan-build-test, which
# uses the `test` suite configured above.
watch:
  repo: seesharpguy/super-portable-software-factory
  label_prefix: spf
  chain: plan-build-test
  base_branch: main
  # Watch worktrees live outside the repo (~/.spf/watch/...), so nothing is
  # installed there. Install without running lifecycle scripts (no lefthook
  # install from inside a worktree), then build the CLI so the test suite and
  # the verification journeys (`node dist/cli/bin.js ...`) can run. Then build
  # the packaged UI: `web/` is gitignored, and the ui_server tests fail without
  # its index.html. build:app:bundle runs `npm --prefix app ci` with lifecycle
  # scripts on (vite needs them) and `vite build` WITHOUT vue-tsc, so an app/
  # type error can't block worktree setup (a revision round must still start);
  # like the root `npm ci`, it needs the network.
  setup:
    - ["npm", "ci", "--ignore-scripts", "--no-audit", "--fund=false"]
    - ["npm", "run", "build:cli"]
    - ["npm", "run", "build:app:bundle"]

# Verification receipts (#159): the planner writes journeys, the change is
# proved before and after (recorded with agent-browser + ttyd), and the PR
# says VERIFIED or UNVERIFIED. Never blocking — an unverified change still
# lands and is escalated to a person. Non-negotiables: .spf/verify/.
# No `store:` here on purpose: unset means the local store (.spf/data/receipts), and a
# machine layer (~/.spf/spf.config.yaml) can point every repo on the box at a shared
# R2/S3 store without this file overriding it.
receipts:
  max_failed_proofs: 3
  record: true
